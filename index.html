<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookFlow | Biblioteca Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #0a0a0f;
      --bg-card: rgba(255,255,255,0.03);
      --primary: #ffffff;
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --accent3: #a78bfa;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f1f5f9;
      --text-light: #94a3b8;
      --glass: rgba(255,255,255,0.05);
      --glass-border: rgba(255,255,255,0.08);
      --glow: 0 0 40px rgba(99,102,241,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ===== LOADING SCREEN ===== */
    .loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.8s, visibility 0.8s;
    }
    .loading-screen.fade-out { opacity: 0; visibility: hidden; }
    .loader {
      width: 60px; height: 60px;
      border: 3px solid rgba(99,102,241,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== PARTICLES BACKGROUND ===== */
    #particles-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== ANIMATED GRADIENT BG ===== */
    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-gradient .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: float 20s ease-in-out infinite;
    }
    .bg-gradient .orb:nth-child(1) {
      width: 600px; height: 600px;
      background: var(--accent);
      top: -200px; left: -200px;
      animation-delay: 0s;
    }
    .bg-gradient .orb:nth-child(2) {
      width: 500px; height: 500px;
      background: var(--accent2);
      bottom: -200px; right: -200px;
      animation-delay: -7s;
    }
    .bg-gradient .orb:nth-child(3) {
      width: 400px; height: 400px;
      background: #ec4899;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -14s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(50px, -50px) scale(1.1); }
      50% { transform: translate(-30px, 30px) scale(0.95); }
      75% { transform: translate(40px, 20px) scale(1.05); }
    }

    /* ===== AUTH SCREEN ===== */
    .auth-screen {
      position: fixed;
      inset: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
      backdrop-filter: blur(20px);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--glass);
      backdrop-filter: blur(40px);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glow), 0 25px 50px rgba(0,0,0,0.5);
      animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    .login-container:hover {
      box-shadow: 0 0 60px rgba(99,102,241,0.4), 0 25px 50px rgba(0,0,0,0.5);
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(40px) rotateX(10deg) scale(0.95); }
      to { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
    }

    .login-container h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 2rem;
      text-align: center;
      background: linear-gradient(135deg, #fff, var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-light);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.3s;
    }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
      background: rgba(255,255,255,0.08);
    }
    .form-group input::placeholder { color: #475569; }

    .btn-login {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
    }
    .btn-login::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent2), #ec4899);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn-login:hover::before { opacity: 1; }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
    .btn-login span { position: relative; z-index: 1; }

    .login-error, .login-success {
      font-size: 0.85rem;
      margin-top: 0.7rem;
      text-align: center;
      display: none;
    }
    .login-error { color: var(--danger); }
    .login-success { color: var(--success); }

    .auth-toggle {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-light);
    }
    .auth-toggle span {
      color: var(--accent3);
      cursor: pointer;
      font-weight: 600;
      transition: color 0.3s;
    }
    .auth-toggle span:hover { color: var(--accent); }

    .hidden { display: none !important; }

    /* ===== MAIN APP ===== */
    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1500px;
      margin: 0 auto;
      padding: 2rem;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      text-align: center;
      margin-bottom: 3rem;
      padding: 3rem 0;
      animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 900;
      background: linear-gradient(135deg, #fff 0%, var(--accent3) 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      line-height: 1.1;
    }
    header p {
      color: var(--text-light);
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* SEARCH */
    .search-wrapper {
      max-width: 650px;
      margin: 0 auto 3rem auto;
      position: relative;
    }
    .search-bar {
      width: 100%;
      padding: 1.1rem 1.5rem 1.1rem 3.5rem;
      font-family: inherit;
      font-size: 1rem;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      color: var(--text-main);
      box-shadow: 0 4px 30px rgba(0,0,0,0.2);
      outline: none;
      transition: all 0.4s;
    }
    .search-bar:focus {
      border-color: var(--accent);
      box-shadow: var(--glow), 0 4px 30px rgba(0,0,0,0.2);
    }
    .search-bar::placeholder { color: #475569; }
    .search-icon {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 1.1rem;
      pointer-events: none;
    }

    /* MAIN LAYOUT */
    .main-layout {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }

    /* SIDEBAR */
    .sidebar-categories {
      width: 260px;
      flex-shrink: 0;
      background: var(--glass);
      backdrop-filter: blur(20px);
      padding: 1.5rem;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px rgba(0,0,0,0.2);
      position: sticky;
      top: 2rem;
      animation: fadeInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }
    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .sidebar-categories h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--glass-border);
      color: var(--text-light);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .category-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      text-align: left;
      padding: 0.8rem 1rem;
      margin-bottom: 0.3rem;
      background: transparent;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-light);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .category-btn:hover {
      background: rgba(99,102,241,0.1);
      color: var(--text-main);
      border-color: rgba(99,102,241,0.2);
    }
    .category-btn.active {
      background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.1));
      color: var(--accent3);
      border-color: rgba(99,102,241,0.3);
      font-weight: 600;
      box-shadow: 0 0 20px rgba(99,102,241,0.1);
    }

    /* CONTENT */
    .content-area { flex-grow: 1; }

    /* BOOK GRID */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 3D BOOK CARD ===== */
    .book-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    .book-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 1px;
      background: linear-gradient(135deg, transparent, rgba(99,102,241,0.3), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }
    .book-card:hover::before { opacity: 1; }
    .book-card:hover {
      transform: translateY(-12px) rotateX(2deg) rotateY(-1deg);
      box-shadow: 0 25px 60px rgba(99,102,241,0.2), 0 0 40px rgba(99,102,241,0.1);
      border-color: rgba(99,102,241,0.2);
    }

    .cover-wrapper {
      position: relative;
      height: 380px;
      overflow: hidden;
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s;
    }
    .book-card:hover .cover-img {
      transform: scale(1.08);
    }
    .cover-wrapper::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to top, rgba(10,10,15,0.95), transparent);
      pointer-events: none;
    }

    .status-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 800;
      color: white;
      z-index: 2;
      backdrop-filter: blur(10px);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-available {
      background: rgba(16,185,129,0.8);
      box-shadow: 0 0 20px rgba(16,185,129,0.3);
    }
    .status-borrowed {
      background: rgba(239,68,68,0.8);
      box-shadow: 0 0 20px rgba(239,68,68,0.3);
    }

    .book-details {
      padding: 1.5rem;
      flex-grow: 1;
      position: relative;
      z-index: 1;
      margin-top: -2rem;
    }
    .book-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      margin-bottom: 0.3rem;
      color: var(--primary);
      line-height: 1.2;
    }
    .book-author {
      color: var(--text-light);
      font-size: 0.85rem;
      font-weight: 400;
    }

    .btn-read, .btn-loan {
      width: 100%;
      padding: 0.85rem;
      border: none;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.8rem;
    }
    .btn-read {
      background: rgba(255,255,255,0.05);
      color: var(--text-light);
      border-top: 1px solid var(--glass-border);
    }
    .btn-read:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

    .state-available {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
    }
    .state-available:hover {
      box-shadow: 0 5px 25px rgba(99,102,241,0.4);
      transform: translateY(-1px);
    }
    .state-borrowed {
      background: rgba(255,255,255,0.05);
      color: var(--text-light);
    }

    /* BORROWED STATE */
    .is-borrowed {
      transform: scale(0.96);
      opacity: 0.7;
    }
    .is-borrowed .cover-img { filter: blur(3px) grayscale(0.8); }
    .is-borrowed::after {
      content: '📖 ARCHIVADO EN TU CUENTA';
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-8deg);
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 0.7rem 1.5rem;
      font-size: 0.75rem;
      font-weight: 800;
      border-radius: 12px;
      letter-spacing: 1.5px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 5;
      border: 1px solid rgba(99,102,241,0.3);
    }

    /* ===== READER MODAL ===== */
    .reader-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 2rem;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .book-container {
      width: 100%;
      max-width: 900px;
      height: 88vh;
      background: #0f0f18;
      border-radius: 24px;
      box-shadow: 0 50px 100px rgba(0,0,0,0.6), 0 0 60px rgba(99,102,241,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      animation: modalIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .book-header {
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1));
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
    }
    .book-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #fff, var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .close-book-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.3s;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-book-btn:hover {
      background: rgba(239,68,68,0.2);
      border-color: rgba(239,68,68,0.3);
      transform: rotate(90deg);
    }

    .book-pages {
      flex-grow: 1;
      padding: 3rem 3.5rem;
      overflow-y: auto;
      line-height: 2;
      font-size: 1.1rem;
      color: #cbd5e1;
      font-family: 'Playfair Display', Georgia, serif;
      text-align: justify;
    }
    .book-pages::-webkit-scrollbar { width: 6px; }
    .book-pages::-webkit-scrollbar-track { background: transparent; }
    .book-pages::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 3px; }

    .book-pages h1 {
      font-family: 'Playfair Display', serif;
      text-align: center;
      margin-bottom: 1rem;
      font-size: 2rem;
      background: linear-gradient(135deg, #fff, var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .book-pages .author-line {
      text-align: center;
      font-style: italic;
      color: var(--text-light);
      text-indent: 0;
      margin-bottom: 2rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
    }
    .book-pages .chapter-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--accent3);
      margin-bottom: 1rem;
    }
    .book-pages p {
      margin-bottom: 1.5rem;
      text-indent: 2rem;
    }

    /* ===== STATS BAR ===== */
    .stats-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.5rem;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }
    .stat-item {
      flex: 1;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: all 0.3s;
    }
    .stat-item:hover {
      border-color: rgba(99,102,241,0.3);
      box-shadow: 0 0 30px rgba(99,102,241,0.1);
    }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
    .stat-icon.blue { background: rgba(99,102,241,0.15); }
    .stat-icon.green { background: rgba(16,185,129,0.15); }
    .stat-icon.pink { background: rgba(236,72,153,0.15); }
    .stat-number { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 0.8rem; color: var(--text-light); font-weight: 500; }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.4); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .main-layout { flex-direction: column; }
      .sidebar-categories { width: 100%; position: static; }
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
      .stats-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- LOADING -->
  <div class="loading-screen" id="loading">
    <div class="loader"></div>
  </div>

  <!-- BG EFFECTS -->
  <div class="bg-gradient">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>
  <canvas id="particles-canvas"></canvas>

  <!-- AUTH -->
  <div id="auth-screen" class="auth-screen">
    <div id="login-box" class="login-container">
      <h2>Iniciar Sesión</h2>
      <form>
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="Tu usuario" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Tu contraseña" required>
        </div>
        <button type="submit" class="btn-login"><span>Ingresar</span></button>
        <p id="error-message" class="login-error">Usuario o contraseña incorrectos.</p>
      </form>
      <p class="auth-toggle">¿No tienes cuenta? <span>Regístrate aquí</span></p>
    </div>
    <div id="register-box" class="login-container hidden">
      <h2>Crear Cuenta</h2>
      <form>
        <div class="form-group">
          <label for="reg-username">Elige un Usuario</label>
          <input type="text" id="reg-username" placeholder="Ej: lector123" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Elige una Contraseña</label>
          <input type="password" id="reg-password" placeholder="Mínimo 4 caracteres" required>
        </div>
        <button type="submit" class="btn-login"><span>Registrarse</span></button>
        <p id="reg-success-message" class="login-success">¡Registro exitoso!</p>
      </form>
      <p class="auth-toggle">¿Ya tienes cuenta? <span>Inicia sesión</span></p>
    </div>
  </div>

  <!-- MAIN -->
  <div class="app-container hidden" id="main-content">
    <header>
      <h1>Biblioteca Pro</h1>
      <p>Gestiona tus préstamos de forma inteligente</p>
    </header>

    <div class="stats-bar" id="stats-bar">
      <div class="stat-item">
        <div class="stat-icon blue">📚</div>
        <div><div class="stat-number" id="stat-total">0</div><div class="stat-label">Total Libros</div></div>
      </div>
      <div class="stat-item">
        <div class="stat-icon green">✅</div>
        <div><div class="stat-number" id="stat-available">0</div><div class="stat-label">Disponibles</div></div>
      </div>
      <div class="stat-item">
        <div class="stat-icon pink">📖</div>
        <div><div class="stat-number" id="stat-borrowed">0</div><div class="stat-label">En Préstamo</div></div>
      </div>
    </div>

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" class="search-bar" placeholder="Buscar por título o autor...">
    </div>

    <div class="main-layout">
      <aside class="sidebar-categories">
        <h2>Categorías</h2>
        <div id="category-list"></div>
      </aside>
      <div class="content-area">
        <main class="book-grid" id="main-catalog"></main>
      </div>
    </div>
  </div>

  <!-- READER MODAL -->
  <div id="book-modal" class="reader-modal hidden">
    <div class="book-container">
      <div class="book-header">
        <h2>📖 Visor de Lectura</h2>
        <button class="close-book-btn" id="close-book-btn">&times;</button>
      </div>
      <div class="book-pages" id="modal-content-pages"></div>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', function() {

    /* ===== PARTICLES ===== */
    var canvas = document.getElementById('particles-canvas');
    var ctx = canvas.getContext('2d');
    var particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    for (var i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        r: Math.random() * 2 + 0.5,
        o: Math.random() * 0.3 + 0.05
      });
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function(p) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(99,102,241,' + p.o + ')';
        ctx.fill();
      });
      particles.forEach(function(a, i) {
        particles.slice(i + 1).forEach(function(b) {
          var dx = a.x - b.x, dy = a.y - b.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = 'rgba(99,102,241,' + (0.06 * (1 - dist / 120)) + ')';
            ctx.stroke();
          }
        });
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    /* ===== LOADING ===== */
    setTimeout(function() {
      document.getElementById('loading').classList.add('fade-out');
    }, 1200);

    /* ===== DATA ===== */
    var categoriesData = [
      { id: "all", label: "Todos los libros", icon: "📚" },
      { id: "suspenso", label: "Suspenso", icon: "🕵️" },
      { id: "terror", label: "Terror", icon: "👻" },
      { id: "ciencia-ficcion", label: "Ciencia Ficción", icon: "🚀" },
      { id: "romance", label: "Romance", icon: "💖" },
      { id: "desarrollo", label: "Desarrollo", icon: "⚡" }
    ];

    var booksData = [
      { id:"book-1", title:"Atomic Habits", author:"James Clear", category:"desarrollo", cover:"https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=400", story:"Había una vez un pequeño cambio que decidió repetirse cada mañana. Al principio, nadie notó su presencia, pero con el tiempo se convirtió en un hábito atómico, transformándolo todo a su alrededor. Cada pequeño paso, cada decisión consciente, se apiló como ladrillos invisibles construyendo una versión mejor de uno mismo..." },
      { id:"book-2", title:"Deep Work", author:"Cal Newport", category:"desarrollo", cover:"https://images.unsplash.com/photo-1589998059171-988d887df646?q=80&w=400", story:"En un mundo lleno de notificaciones intermitentes, un programador cerró todas sus pestañas y se sumergió en el trabajo profundo. Fue allí, en el silencio absoluto, donde nacieron las grandes ideas. La concentración se convirtió en su superpoder más valioso..." },
      { id:"book-3", title:"Clean Code", author:"Robert C. Martin", category:"desarrollo", cover:"https://images.unsplash.com/photo-1512820790803-83ca734da794?q=80&w=400", story:"El código limpio no es solo sintaxis corregida; es poesía para máquinas. Aquel desarrollador sabía que escribir un código comprensible era un acto de respeto hacia el próximo humano que leyera sus líneas. Cada función era una pequeña obra de arte, cada variable contaba una historia..." },
      { id:"book-4", title:"The Psychology of Money", author:"Morgan Housel", category:"desarrollo", cover:"https://images.unsplash.com/photo-1532012197367-e338421e2eca?q=80&w=400", story:"La psicología del dinero nos enseña que la riqueza no es lo que compras, sino las opciones y la libertad que conservas. No se trata de inteligencia pura, sino de controlar tus propios impulsos cotidianos. El verdadero éxito financiero es silencioso..." },
      { id:"book-13", title:"The Pragmatic Programmer", author:"Andy Hunt", category:"desarrollo", cover:"https://images.unsplash.com/photo-1506880018603-83d5b814b5a6?q=80&w=400", story:"El programador pragmático nunca asume que las cosas funcionan solo porque compilan. Viaja ligero, automatiza lo repetitivo, cuida su entorno de trabajo y siempre, siempre mantiene viva su curiosidad. La experiencia no se mide en años, sino en lecciones aprendidas..." },
      { id:"book-14", title:"Soft Skills", author:"John Sonmez", category:"desarrollo", cover:"https://images.unsplash.com/photo-1516414447565-b14be0adf13e?q=80&w=400", story:"Más allá de los algoritmos se encuentran las habilidades blandas. Aprender a escuchar, comunicar y empatizar resultó ser el código secreto más potente para liderar los proyectos tecnológicos del mañana. El verdadero talento reside en las personas..." },
      { id:"book-5", title:"El Principito", author:"Antoine de Saint-Exupéry", category:"romance", cover:"https://images.unsplash.com/photo-1541963463532-d68292c34b19?q=80&w=400", story:"Vivía en un asteroide apenas más grande que él, cuidando de su rosa caprichosa. Un buen día, el Principito decidió explorar otros mundos para comprender qué era aquello tan invisible a los ojos de los adultos. Solo los corazones simples pueden ver lo esencial..." },
      { id:"book-6", title:"Sapiens", author:"Yuval Noah Harari", category:"ciencia-ficcion", cover:"https://images.unsplash.com/photo-1495446815901-a7297e633e8d?q=80&w=400", story:"Desde insignificantes simios en un rincón de África hasta convertirnos en los gobernantes indiscutibles del planeta Tierra. Sapiens explora cómo los mitos compartidos crearon imperios interconectados. La historia de la humanidad es la historia de las historias..." },
      { id:"book-7", title:"El Psicoanalista", author:"John Katzenbach", category:"suspenso", cover:"https://images.unsplash.com/photo-1516979187457-637abb4f9353?q=80&w=400", story:"El día de su cumpleaños número cincuenta, el psicoanalista recibió una carta firmada por un antiguo paciente anónimo: 'Bienvenido al primer día de su muerte. Tiene quince días para descubrir quién soy'. Una mente brillante contra un enigma mortal..." },
      { id:"book-8", title:"La Chica del Tren", author:"Paula Hawkins", category:"suspenso", cover:"https://images.unsplash.com/photo-1587876931567-564ce588bfbd?q=80&w=400", story:"Ella miraba por la ventana del tren cada mañana, imaginando vidas perfectas para los desconocidos de las casas de la vía. Hasta que un día, un parpadeo fugaz la convirtió en testigo de un misterio atroz. Las apariencias engañan, y los trenes no paran..." },
      { id:"book-15", title:"Código Da Vinci", author:"Dan Brown", category:"suspenso", cover:"https://images.unsplash.com/photo-1543002588-bfa74002ed7e?q=80&w=400", story:"Un cadáver en el Museo del Louvre y una serie de extraños símbolos ocultos en las pinturas de Leonardo da Vinci desatan una frenética carrera para proteger el secreto mejor guardado de la humanidad. Cada pista es un enigma, cada verdad una conspiración..." },
      { id:"book-16", title:"Ángeles y Demonios", author:"Dan Brown", category:"suspenso", cover:"https://images.unsplash.com/photo-1629992101753-56d196c8aabb?q=80&w=400", story:"Ángeles y Demonios se enfrentan en los pasillos secretos del Vaticano. Una antigua hermandad resurrecha amenaza con destruir la ciudad entera usando una sustancia científica devastadora. El tiempo corre, y la ciencia y la fe colisionan..." },
      { id:"book-9", title:"It (Eso)", author:"Stephen King", category:"terror", cover:"https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=400", story:"Bajo las calles del pequeño pueblo de Derry, algo milenario despierta cada veintisiete años adoptando la forma de tus peores pesadillas. Un grupo de niños se une para enfrentar su terror más profundo. Lo verdaderamente aterrador no es el monstruo, sino el miedo..." },
      { id:"book-10", title:"Drácula", author:"Bram Stoker", category:"terror", cover:"https://images.unsplash.com/photo-1618666012174-83b441c0bc76?q=80&w=400", story:"A través de las brumas transilvanas, el Conde Drácula aguarda en su castillo de sombras. Un viaje marítimo llevará la maldición eterna de la sangre directo a las costas del Londres victoriano. La sed de eternidad no conoce piedad..." },
      { id:"book-virtual", title:"El Fantasma de la Ópera", author:"Gaston Leroux", category:"terror", cover:"https://images.unsplash.com/photo-1514894780887-121968d00567?q=80&w=400", story:"Aquella noche, la Ópera de París estaba envuelta en un aire de misterio inusitado. Los carruajes se amontonaban frente a la imponente fachada. Christine Daaé escuchaba una voz hermosa y melodiosa a través de las paredes: 'El Ángel de la Música te ha elegido'..." },
      { id:"book-17", title:"El Resplandor", author:"Stephen King", category:"terror", cover:"https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=400", story:"El hotel Overlook cierra sus puertas durante el crudo invierno. En su interior solitario, las paredes susurran antiguas tragedias y la mente de su cuidador comienza a perderse en el laberinto del resplandor. El hotel tiene memoria, y no olvida..." },
      { id:"book-11", title:"Dune", author:"Frank Herbert", category:"ciencia-ficcion", cover:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=400", story:"En el vasto y desértico planeta Arrakis, la especia debe fluir a cualquier costo. Paul Atreides se embarca en un destino profético entre las dunas para cambiar las riendas del universo entero. El desierto guarda secretos más antiguos que las estrellas..." },
      { id:"book-18", title:"Yo, Robot", author:"Isaac Asimov", category:"ciencia-ficcion", cover:"https://images.unsplash.com/photo-1546776310-eef45dd6d63c?q=80&w=400", story:"Las tres leyes de la robótica parecían perfectas e inquebrantables. Sin embargo, la evolución de la inteligencia artificial plantea preguntas donde la línea entre el metal y el alma se vuelve difusa. ¿Puede una máquina sentir?" },
      { id:"book-19", title:"Neuromante", author:"William Gibson", category:"ciencia-ficcion", cover:"https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=400", story:"En el cielo tecnológico sobre Chiba, un hacker informático sin opciones se conecta a la red neuronal del Neuromante. Una última misión en la matrix para recuperar su vida o perderse en los datos para siempre. El ciberespacio es el nuevo Oeste..." },
      { id:"book-12", title:"Orgullo y Prejuicio", author:"Jane Austen", category:"romance", cover:"https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=400", story:"No hay distancias cuando el orgullo cede y los prejuicios se desvanecen. Elizabeth Bennet y el señor Darcy descubren que las primeras impresiones rara vez muestran el verdadero valor del corazón. El amor verdadero siempre encuentra su camino..." },
      { id:"book-20", title:"Bajo la misma estrella", author:"John Green", category:"romance", cover:"https://images.unsplash.com/photo-1474552226712-ac0f0961a954?q=80&w=400", story:"A pesar de las estrellas adversas y los diagnósticos médicos complicados, la vida florece con una intensidad brillante cuando dos jóvenes deciden compartir sus infinitos días contados. El amor hace que la eternidad sea un suspiro..." },
      { id:"book-21", title:"Cumbres Borrascosas", author:"Emily Brontë", category:"romance", cover:"https://images.unsplash.com/photo-1516627145497-ae6968895b74?q=80&w=400", story:"En los páramos desolados y azotados por el viento de Cumbres Borrascosas, un amor apasionado y destructivo se gesta a través de las generaciones, desafiando las convenciones sociales y el tiempo. El amor más puro es también el más salvaje..." }
    ];

    /* ===== AUTH ===== */
    var usuariosRegistrados = { "admin": "1234" };
    var loginBox = document.getElementById('login-box');
    var registerBox = document.getElementById('register-box');

    document.querySelectorAll('.auth-toggle span').forEach(function(span) {
      span.addEventListener('click', function() {
        loginBox.classList.toggle('hidden');
        registerBox.classList.toggle('hidden');
        document.getElementById('error-message').style.display = 'none';
        document.getElementById('reg-success-message').style.display = 'none';
      });
    });

    registerBox.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
      var user = document.getElementById('reg-username').value.trim();
      var pass = document.getElementById('reg-password').value;
      var msg = document.getElementById('reg-success-message');
      if (user && pass) {
        usuariosRegistrados[user] = pass;
        msg.style.display = 'block';
        registerBox.querySelector('form').reset();
        setTimeout(function() {
          loginBox.classList.toggle('hidden');
          registerBox.classList.toggle('hidden');
          msg.style.display = 'none';
        }, 1500);
      }
    });

    loginBox.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
      var userInput = document.getElementById('username').value.trim();
      var passInput = document.getElementById('password').value;
      var errorMsg = document.getElementById('error-message');
      if (usuariosRegistrados[userInput] && usuariosRegistrados[userInput] === passInput) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        updateStats();
      } else {
        errorMsg.style.display = 'block';
      }
    });

    /* ===== STATS ===== */
    var borrowedCount = 0;
    function updateStats() {
      document.getElementById('stat-total').textContent = booksData.length;
      document.getElementById('stat-available').textContent = booksData.length - borrowedCount;
      document.getElementById('stat-borrowed').textContent = borrowedCount;
    }

    /* ===== BOOKS ===== */
    var currentCategory = 'all';
    var categoryContainer = document.getElementById('category-list');
    var bookGrid = document.getElementById('main-catalog');
    var searchInput = document.getElementById('search-input');

    categoriesData.forEach(function(cat) {
      var btn = document.createElement('button');
      btn.className = 'category-btn' + (cat.id === 'all' ? ' active' : '');
      btn.textContent = cat.icon + ' ' + cat.label;
      btn.addEventListener('click', function() {
        currentCategory = cat.id;
        categoryContainer.querySelectorAll('.category-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        applyFilter();
      });
      categoryContainer.appendChild(btn);
    });

    booksData.forEach(function(book, index) {
      var article = document.createElement('article');
      article.className = 'book-card';
      article.id = book.id;
      article.dataset.category = book.category;
      article.style.animationDelay = (index * 0.05) + 's';
      article.innerHTML =
        '<div class="cover-wrapper">' +
          '<span class="status-badge status-available">Disponible</span>' +
          '<img src="' + book.cover + '" class="cover-img" alt="' + book.title + '">' +
        '</div>' +
        '<div class="book-details">' +
          '<h3 class="book-title">' + book.title + '</h3>' +
          '<p class="book-author">' + book.author + '</p>' +
        '</div>' +
        '<button class="btn-read">📖 Leer Online</button>' +
        '<button class="btn-loan state-available">Solicitar Préstamo</button>';
      bookGrid.appendChild(article);
    });

    /* ===== FILTER ===== */
    function applyFilter() {
      var query = searchInput.value.toLowerCase().trim();
      bookGrid.querySelectorAll('.book-card').forEach(function(card) {
        var category = card.dataset.category;
        var title = card.querySelector('.book-title').textContent.toLowerCase();
        var author = card.querySelector('.book-author').textContent.toLowerCase();
        var matchCat = currentCategory === 'all' || category === currentCategory;
        var matchSearch = title.indexOf(query) !== -1 || author.indexOf(query) !== -1;
        card.style.display = (matchCat && matchSearch) ? 'flex' : 'none';
      });
    }
    searchInput.addEventListener('input', applyFilter);

    /* ===== LOAN + READ ===== */
    bookGrid.addEventListener('click', function(e) {
      var card = e.target.closest('.book-card');
      if (!card) return;

      if (e.target.classList.contains('btn-read')) {
        openVirtualBook(card.id);
      }

      if (e.target.classList.contains('btn-loan')) {
        var btn = e.target;
        var badge = card.querySelector('.status-badge');
        var isBorrowed = card.classList.contains('is-borrowed');
        if (!isBorrowed) {
          card.classList.add('is-borrowed');
          badge.textContent = 'En Préstamo';
          badge.classList.replace('status-available', 'status-borrowed');
          btn.textContent = 'Devolver Libro';
          btn.classList.replace('state-available', 'state-borrowed');
          borrowedCount++;
        } else {
          card.classList.remove('is-borrowed');
          badge.textContent = 'Disponible';
          badge.classList.replace('status-borrowed', 'status-available');
          btn.textContent = 'Solicitar Préstamo';
          btn.classList.replace('state-borrowed', 'state-available');
          borrowedCount--;
        }
        updateStats();
      }
    });

    /* ===== READER MODAL ===== */
    function openVirtualBook(bookId) {
      var book = booksData.find(function(b) { return b.id === bookId; });
      if (!book) return;
      document.getElementById('modal-content-pages').innerHTML =
        '<h1>' + book.title + '</h1>' +
        '<p class="author-line">Por ' + book.author + '</p>' +
        '<p class="chapter-title">Capítulo I: El Inicio del Viaje</p>' +
        '<p>' + book.story + '</p>' +
        '<p>El relato continúa atrapando al lector línea tras línea, recordándonos que cada página abierta es una puerta hacia un universo completamente nuevo y lleno de infinitas sorpresas. Las palabras danzan ante nuestros ojos como estrellas fugaces en una noche sin fin, invitándonos a perdernos para encontrarnos.</p>' +
        '<p class="chapter-title">Capítulo II: El Camino</p>' +
        '<p>En algún lugar entre las páginas, la verdad espera pacientemente a ser descubierta. Los personajes cobran vida, sus voces resonando en la mente del lector como ecos de una realidad paralela. Cada capítulo es un paso más hacia la comprensión de algo mucho mayor que nosotros mismos.</p>';
      document.getElementById('book-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    document.getElementById('close-book-btn').addEventListener('click', function() {
      document.getElementById('book-modal').classList.add('hidden');
      document.body.style.overflow = '';
    });

    document.getElementById('book-modal').addEventListener('click', function(e) {
      if (e.target === e.currentTarget) {
        e.currentTarget.classList.add('hidden');
        document.body.style.overflow = '';
      }
    });

  });
  </script>
</body>
</html>
